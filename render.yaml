# Render Blueprint: New → Blueprint → pick this repo. Fill the secret env vars when prompted.
services:
  - type: web
    name: crumb-and-craft-api
    runtime: node
    region: singapore
    plan: free               # Free: sleeps after ~15 min idle (first request then takes ~1 min). Change to "starter" ($7/mo) to stay always-on.
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
