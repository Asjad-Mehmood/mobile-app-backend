name: crumb_core
description: "Crumb & Craft shared models, API client, realtime sync, theme and widgets."
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^4.0.4
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  web_socket_channel: ^3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: fonts/playfair_display.ttf
        - asset: fonts/playfair_display_italic.ttf
          style: italic
    - family: PlusJakartaSans
      fonts:
        - asset: fonts/plus_jakarta_sans.ttf
